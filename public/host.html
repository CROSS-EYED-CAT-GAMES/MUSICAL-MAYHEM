<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSICAL MAYHEM · Host</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { padding: 18px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }
  .team-card { border: 2px solid var(--ink); border-radius: 16px; padding: 12px; background: var(--bg3); box-shadow: 3px 3px 0 var(--ink); }
  .team-card .score { font-size: 30px; }
  .mini-btn { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  #eventLog { max-height: 260px; overflow-y: auto; font-family: monospace; font-size: 12px; }
  #eventLog .ev { padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  select { background: var(--bg3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .gate { max-width: 380px; margin: 80px auto; }
  audio { width: 100%; margin-top: 8px; }
  .challenge-row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 12px; }
  .challenge-row:hover { background: var(--bg3); }
  .challenge-row.legacy { opacity: .75; }
  .option-card { border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; background: var(--bg3); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; text-align: left; width: 100%; }
  .option-card:hover { background: #fff; }
  .config-grid { max-height: 320px; overflow-y: auto; margin-top: 8px; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="card">
    <h2 style="margin-top:0">🎛️ MUSICAL MAYHEM · Host</h2>
    <p class="muted small">Entrez la clé animateur affichée dans la console du serveur.</p>
    <input type="text" id="hostKeyInput" placeholder="CLÉ ANIMATEUR" style="text-transform:uppercase">
    <button class="btn primary block" style="margin-top:10px" onclick="mmSetHostKey()">ENTRER</button>
    <p id="gateError" class="pink small hidden">Clé incorrecte.</p>
  </div>
</div>

<div id="cockpit" class="hidden">
  <div class="row between">
    <div class="row">
      <span class="badge on" id="connBadge">🟢 connecté</span>
      <span class="badge" id="phaseBadge">LOBBY</span>
      <span class="badge" id="codeBadge">CODE ----</span>
      <span class="badge" id="progressBadge">0/0 défis</span>
    </div>
    <div class="row">
      <button class="btn ghost mini-btn" id="skipBtn" onclick="mmSkipChallenge()" hidden>⏭ SKIP CHALLENGE</button>
      <button class="btn ghost mini-btn" onclick="mmUndo()">↩ UNDO</button>
      <button class="btn ghost mini-btn" onclick="mmDemo()">🧪 DEMO</button>
      <a class="btn ghost mini-btn" href="/api/export.csv" target="_blank" style="text-decoration:none">⬇ CSV</a>
      <button class="btn danger mini-btn" onclick="mmReset()">RESET</button>
    </div>
  </div>

  <div class="cols" style="margin-top:14px">
    <div class="col">
      <div class="card" id="controlPanel"></div>
      <div class="card" id="spotifyPanel"></div>
      <div class="card" id="audioPanel"></div>
    </div>
    <div class="col">
      <div class="card">
        <div class="row between"><b>ÉQUIPES</b><button class="btn ghost mini-btn" onclick="mmTriggerChaos()">🌀 CHAOS</button></div>
        <div class="grid" id="teamsGrid" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <b>JOURNAL</b>
        <div id="eventLog" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="row between">
      <b>🔍 RECHERCHE SPOTIFY</b>
      <span class="muted small">Cherchez un morceau, puis ajoutez-le directement à une épreuve</span>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="spotifyQuery" placeholder="Titre, artiste..." style="flex:1" onkeydown="if(event.key==='Enter'){mmSpotifySearch()}">
      <button class="btn primary" onclick="mmSpotifySearch()">Chercher</button>
    </div>
    <div id="spotifyResults" style="margin-top:10px"></div>
    <div class="card tight" style="margin-top:12px;border-color:var(--acid)">
      <b class="small">➕ AJOUTER UNE QUESTION</b>
      <div id="addQuestionPanel"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/client.js"></script>
<script src="/js/host.js"></script>
</body>
</html>
