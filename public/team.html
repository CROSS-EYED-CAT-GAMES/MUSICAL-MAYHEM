<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MUSICAL MAYHEM · Team</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { padding: 16px; padding-bottom: 40px; }
  .team-pick { display:flex; align-items:center; gap:12px; padding:18px; border-radius:18px; border:3px solid var(--ink); background:var(--bg2); font-weight:800; font-size:18px; cursor:pointer; width:100%; box-shadow:4px 4px 0 var(--ink); }
  .team-pick:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .team-pick .emoji { font-size:30px; }
  .effect-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .swatch-btn { width:46px; height:46px; border-radius:50%; border:3px solid var(--ink); font-size:19px; cursor:pointer; }
  .swatch-btn:disabled { opacity:.35; cursor:not-allowed; }
  .target-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .target-list .btn { flex:1; min-width:100px; }
  #panicList { max-height:160px; overflow-y:auto; margin-top:10px; }
  .panic-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .option-card { border: 3px solid var(--ink); border-radius: 16px; padding: 14px; background: var(--bg3); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; text-align: left; width: 100%; margin-top: 10px; }
  .option-card:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .choice-option { display:flex; align-items:center; gap:10px; padding:14px; border-radius:14px; border:3px solid var(--ink); background:var(--bg3); margin-top:8px; cursor:pointer; font-weight:800; }
  .choice-option:active { transform: translate(3px,3px); }
  .choice-option.picked { background: var(--acid); }
  .choice-option.correct { background: var(--acid); }
  .choice-option:disabled, .choice-option[disabled] { opacity:.7; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap" style="padding:0">
  <div class="row between" style="margin-bottom:12px">
    <div class="logo" style="font-size:26px">MAYHEM</div>
    <span class="badge on" id="connBadge">🟢 connecté</span>
  </div>

  <div id="joinScreen">
    <div class="card">
      <h2 style="margin-top:0">Rejoindre la partie</h2>
      <div class="col">
        <label class="muted small">CODE (affiché sur l'écran)</label>
        <input type="text" id="codeInput" maxlength="4" inputmode="numeric" placeholder="0000">
      </div>
      <div class="col" style="margin-top:16px" id="teamPickList"></div>
      <p id="joinError" class="pink small hidden"></p>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="card glow">
      <div class="row between">
        <div id="myTeamChip" class="team-chip"></div>
        <div class="score" id="myScore">0</div>
      </div>
      <div class="effect-badges" id="myEffects"></div>
    </div>

    <div id="myPayload"></div>

    <div id="phaseArea" style="margin-top:14px"></div>

    <div class="card" style="margin-top:14px" id="powersCard">
      <div class="muted small" style="letter-spacing:.08em">MAYHEM CARDS</div>
      <div id="powersList"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="/js/client.js"></script>
<script src="/js/team.js"></script>
</body>
</html>
